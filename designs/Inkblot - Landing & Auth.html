<style>
  html, body { background: #FBF6EC; color: #1B1830; }
  body { font-family: 'Inter', system-ui, sans-serif; }
  .font-display { font-family: 'Fredoka', system-ui, sans-serif; }
  .font-hand { font-family: 'Caveat', cursive; }

  /* Paper grain */
  .paper-grain {
    background-color: #FBF6EC;
    background-image:
      radial-gradient(rgba(27,24,48,0.035) 1px, transparent 1px),
      radial-gradient(rgba(27,24,48,0.025) 1px, transparent 1px);
    background-size: 3px 3px, 7px 7px;
    background-position: 0 0, 1px 1px;
  }

  /* Glassmorphic auth card */
  .glass {
    background: linear-gradient(180deg, rgba(255,255,255,0.72), rgba(255,255,255,0.45));
    backdrop-filter: blur(16px) saturate(140%);
    -webkit-backdrop-filter: blur(16px) saturate(140%);
    border: 1px solid rgba(255,255,255,0.6);
    box-shadow:
      0 1px 0 rgba(255,255,255,0.9) inset,
      0 30px 60px -20px rgba(31,27,92,0.25),
      0 8px 24px -10px rgba(31,27,92,0.18);
  }

  /* Hand-drawn underline */
  .squiggle-underline { position: relative; display: inline-block; }
  .squiggle-underline::after{
    content: '';
    position: absolute;
    left: -4%;
    right: -4%;
    bottom: -10px;
    height: 14px;
    background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 14' preserveAspectRatio='none'><path d='M2 8 Q 25 1 50 7 T 100 7 T 150 7 T 198 7' fill='none' stroke='%23F59E0B' stroke-width='4' stroke-linecap='round'/></svg>") center/100% 100% no-repeat;
  }

  /* Dashed canvas frame */
  .dashed-frame {
    background-image: repeating-linear-gradient(0deg, #1B1830 0 6px, transparent 6px 12px),
                      repeating-linear-gradient(90deg, #1B1830 0 6px, transparent 6px 12px),
                      repeating-linear-gradient(180deg, #1B1830 0 6px, transparent 6px 12px),
                      repeating-linear-gradient(270deg, #1B1830 0 6px, transparent 6px 12px);
    background-size: 1.5px 100%, 100% 1.5px, 1.5px 100%, 100% 1.5px;
    background-position: 0 0, 0 0, 100% 0, 0 100%;
    background-repeat: no-repeat;
  }

  /* Subtle paint-stroke under headline */
  .paint-stroke {
    background: linear-gradient(90deg, transparent 0%, #FCD34D 18%, #FCD34D 80%, transparent 100%);
    transform: skewX(-6deg) translateY(2px);
    border-radius: 999px;
  }

  /* Marquee */
  @keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  .marquee-track { animation: marquee 32s linear infinite; }

  /* Floating supplies — CSS-animated to keep the bg lightweight */
  @keyframes floatA { 0%,100% { transform: translateY(0) rotate(var(--r,0deg)); } 50% { transform: translateY(-14px) rotate(calc(var(--r,0deg) + 6deg)); } }
  @keyframes floatB { 0%,100% { transform: translateY(0) rotate(var(--r,0deg)); } 50% { transform: translateY(10px) rotate(calc(var(--r,0deg) - 5deg)); } }
  .float-a { animation: floatA var(--dur,14s) ease-in-out infinite; animation-delay: var(--dly,0s); }
  .float-b { animation: floatB var(--dur,14s) ease-in-out infinite; animation-delay: var(--dly,0s); }
  @keyframes floaterFade { from { opacity: 0; } to { opacity: 1; } }
  .floater-fade { animation: floaterFade .9s ease-out both; }

  /* Cursor blink */
  @keyframes blink { 50% { opacity: 0; } }
  .blink { animation: blink 1s steps(1) infinite; }

  /* Custom scrollbar trim for the auth pane on small screens */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: rgba(27,24,48,0.18); border-radius: 8px; }

  /* Selection */
  ::selection { background: #F59E0B; color: #1B1830; }

const Brush = ({className=''}) => (

    <rect x="40" y="10" width="60" height="2" fill="#A78BFA"/>
    <rect x="100" y="8" width="6" height="12" rx="1" fill="#312E81"/>

    <path d="M6 14 Q 16 9 26 14 Q 16 19 6 14 Z" fill="#34D399"/>

const PaintBlob = ({className=''}) => (
  <svg viewBox="0 0 60 60" className={className}>
    <path d="M30 4 C 44 6 56 18 54 32 C 53 44 44 54 32 56 C 18 57 6 48 4 34 C 2 20 14 6 30 4 Z" fill="#EC4899"/>
    <circle cx="22" cy="22" r="5" fill="#FBF6EC" opacity="0.7"/>
    <circle cx="46" cy="48" r="3" fill="#9D174D"/>

const Eraser = ({className=''}) => (
  <svg viewBox="0 0 60 36" className={className}>

const Squiggle = ({className=''}) => (

const Splat = ({className='', color='#10B981'}) => (

const ColorDot = ({className='', color='#F59E0B'}) => (

const FLOATERS = [
  { Comp: Pencil,  top:'8%',  left:'6%',  w:130, dur:14, delay:0, rot:-18 },
  { Comp: Brush,   top:'72%', left:'4%',  w:110, dur:18, delay:1.2, rot:24 },
  { Comp: PaintBlob, top:'18%', left:'42%', w:54, dur:11, delay:0.4, rot:0 },
  { Comp: Eraser,  top:'82%', left:'40%', w:64, dur:13, delay:2.0, rot:-12 },
  { Comp: Squiggle, top:'14%', left:'72%', w:120, dur:16, delay:0.8, rot:8 },
  { Comp: Splat,   top:'58%', left:'88%', w:90, dur:20, delay:0.2, rot:0,
                   props:{color:'#10B981'} },
  { Comp: Splat,   top:'4%',  left:'52%', w:60, dur:17, delay:1.6, rot:0,
                   props:{color:'#EC4899'} },
  { Comp: ColorDot,top:'46%', left:'2%',  w:18, dur:10, delay:0, rot:0,
                   props:{color:'#F59E0B'} },
  { Comp: ColorDot,top:'30%', left:'94%', w:14, dur:9, delay:0.7, rot:0,
                   props:{color:'#312E81'} },
  { Comp: ColorDot,top:'90%', left:'70%', w:22, dur:12, delay:0.3, rot:0,
                   props:{color:'#EC4899'} },
];

const Floater = ({ f, idx }) => {
  const Comp = f.Comp;
  const cls = idx % 2 === 0 ? 'float-a' : 'float-b';
  return (
    <div
      className={cls}
      style={{
        position:'absolute', top:f.top, left:f.left, width:f.w,
        '--r': f.rot + 'deg',
        '--dur': f.dur + 's',
        '--dly': f.delay + 's',
      }}
    >
      <Comp className="w-full h-auto drop-shadow-[0_10px_20px_rgba(31,27,92,0.18)]" {...(f.props||{})}/>
    </div>
  );
};

const FloatingSupplies = () => {
  return (
    <div
      aria-hidden
      className="pointer-events-none absolute inset-0 overflow-hidden floater-fade"
    >
      {FLOATERS.map((f, i) => <Floater key={'fl-'+i} f={f} idx={i}/>)}

  );
};

/* ────────────────────────────────────────────────────────────────────────

const HeroLogo = () => (

    <motion.h1

    whileHover={{ y:-2 }}
    className="flex items-center gap-2.5 bg-white/60 backdrop-blur border border-white/80 rounded-full px-3.5 py-2 shadow-sm"

const RotatingWord = () => {
  const words = ['banana','volcano','astronaut','spaghetti','dragon','submarine','penguin','tornado'];
  const [i, setI] = useState(0);
  useEffect(()=>{ const t = setInterval(()=> setI(v=> (v+1)%words.length), 2200); return ()=> clearInterval(t); },[]);
  return (
    <span className="relative inline-flex items-baseline">
      <AnimatePresence mode="wait">
        <motion.span
          key={words[i]}
          initial={{ y: 14, opacity: 0, rotate: -3 }}
          animate={{ y: 0, opacity: 1, rotate: 0 }}
          exit={{ y: -14, opacity: 0, rotate: 3 }}
          transition={{ type:'spring', stiffness:240, damping:18 }}
          className="font-hand text-amber-brand font-bold text-[1.15em]"
        >“{words[i]}”</motion.span>
      </AnimatePresence>
      <span className="font-hand text-ink blink ml-0.5">|</span>
    </span>
  );
};

/* ────────────────────────────────────────────────────────────────────────
 *  AUTH CARD — Login / Signup with toggle + inline validation
 * ──────────────────────────────────────────────────────────────────────── */
const validators = {
  name:  (v) => !v ? 'Pick a nickname so people can roast you.' : v.length < 2 ? 'Too short.' : v.length > 16 ? 'Max 16 characters.' : '',
  email: (v) => !v ? 'Email required.' : !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v) ? "That doesn't look like an email." : '',
  pass:  (v) => !v ? 'Password required.' : v.length < 8 ? 'Min 8 characters.' : '',
};

const Field = ({ icon:IconC, type='text', label, value, onChange, onBlur, error, touched, right, autoComplete }) => {
  const [focused, setFocused] = useState(false);
  const ok = touched && !error && value;
  const bad = touched && error;
  return (
    <div className="space-y-1.5">
      <label className="text-xs font-semibold text-ink-soft uppercase tracking-wider flex items-center gap-2">
        {label}
        <AnimatePresence>
          {ok && (
            <motion.span
              initial={{ scale:0, opacity:0 }} animate={{ scale:1, opacity:1 }} exit={{ scale:0, opacity:0 }}
              className="inline-flex items-center justify-center w-4 h-4 rounded-full bg-mint-splat text-white"
            ><I.Check size={11} stroke={3}/></motion.span>
          )}
        </AnimatePresence>
      </label>
      <div className={`relative flex items-center gap-2 rounded-xl bg-white/80 border transition-all
        ${bad ? 'border-rose-splat/70 ring-2 ring-rose-splat/15'
              : focused ? 'border-indigo-brand/70 ring-2 ring-indigo-brand/15'
              : 'border-ink/10'}`}>
        <span className={`pl-3.5 ${bad ? 'text-rose-splat' : focused ? 'text-indigo-brand' : 'text-ink-mute'}`}>
          <IconC size={16}/>
        </span>
        <input
          type={type}
          value={value}
          autoComplete={autoComplete}
          onChange={(e)=> onChange(e.target.value)}
          onFocus={()=> setFocused(true)}
          onBlur={()=> { setFocused(false); onBlur && onBlur(); }}
          className="flex-1 bg-transparent py-3 pr-3 text-ink placeholder:text-ink-mute/60 outline-none text-[15px]"
          placeholder={label}
        />
        {right && <span className="pr-3">{right}</span>}
      </div>
      <AnimatePresence>
        {bad && (
          <motion.p
            initial={{ opacity:0, y:-4, height:0 }}
            animate={{ opacity:1, y:0, height:'auto' }}
            exit={{ opacity:0, y:-4, height:0 }}
            className="text-[12px] text-rose-splat font-medium pl-1"
          >{error}</motion.p>
        )}
      </AnimatePresence>
    </div>
  );
};

const PasswordStrength = ({ value }) => {
  const score = useMemo(()=>{
    let s = 0;
    if (value.length >= 8) s++;
    if (/[A-Z]/.test(value)) s++;
    if (/[0-9]/.test(value)) s++;
    if (/[^A-Za-z0-9]/.test(value)) s++;
    return s;
  }, [value]);
  const labels = ['','weak','okay','strong','muscle'];
  const colors = ['bg-ink/15','bg-rose-splat','bg-amber-brand','bg-mint-splat','bg-indigo-brand'];
  return (
    <div className="flex items-center gap-2 pt-1">
      <div className="flex-1 grid grid-cols-4 gap-1">
        {[0,1,2,3].map(i=>(
          <div key={i} className="h-1.5 rounded-full bg-ink/10 overflow-hidden">
            <motion.div
              initial={false}
              animate={{ width: score > i ? '100%' : '0%' }}
              transition={{ type:'spring', stiffness:160, damping:18 }}
              className={`h-full ${score > i ? colors[score] : ''}`}
            />
          </div>
        ))}
      </div>
      <span className="text-[11px] font-semibold uppercase tracking-wider text-ink-mute w-14 text-right">
        {labels[score]}
      </span>
    </div>
  );
};

const AuthCard = () => {
  const [mode, setMode] = useState('login'); // 'login' | 'signup'
  const [showPass, setShowPass] = useState(false);
  const [form, setForm] = useState({ name:'', email:'', pass:'' });
  const [errors, setErrors] = useState({});
  const [touched, setTouched] = useState({});
  const [submitting, setSubmitting] = useState(false);
  const [done, setDone] = useState(false);

  const set = (k,v) => {
    setForm(f => ({...f, [k]:v}));
    if (touched[k]) setErrors(e => ({...e, [k]: validators[k]?.(v) || ''}));
  };
  const blur = (k) => {
    setTouched(t => ({...t, [k]: true}));
    setErrors(e => ({...e, [k]: validators[k]?.(form[k]) || ''}));
  };

  const isValid = useMemo(()=>{
    const required = mode === 'signup' ? ['name','email','pass'] : ['email','pass'];
    return required.every(k => form[k] && !validators[k](form[k]));
  }, [form, mode]);

  const submit = async (e) => {
    e.preventDefault();
    const required = mode === 'signup' ? ['name','email','pass'] : ['email','pass'];
    const newErrors = {};
    const newTouched = {};
    required.forEach(k => { newErrors[k] = validators[k](form[k]); newTouched[k] = true; });
    setErrors(newErrors); setTouched(newTouched);
    if (Object.values(newErrors).some(Boolean)) return;
    setSubmitting(true);
    await new Promise(r => setTimeout(r, 1100));
    setSubmitting(false);
    setDone(true);
    setTimeout(()=> setDone(false), 1600);
  };

  return (
    <motion.div
      initial={{ opacity:0, y:30, rotate:1 }}
      animate={{ opacity:1, y:0, rotate:1 }}
      transition={{ delay:0.4, duration:0.7, ease:[0.2,0.8,0.2,1] }}
      className="relative w-full max-w-[440px]"
    >
      {/* Tape strips */}
      <div className="absolute -top-3 left-8 w-16 h-5 bg-amber-soft/80 rotate-[-6deg] rounded-[2px] shadow-sm z-20"></div>
      <div className="absolute -top-2 right-10 w-12 h-5 bg-rose-splat/40 rotate-[8deg] rounded-[2px] shadow-sm z-20"></div>

      <div className="glass rounded-3xl p-6 sm:p-7 relative overflow-hidden">
        {/* Card header */}
        <div className="flex items-center justify-between mb-5">
          <div>
            <p className="font-hand text-amber-brand text-2xl leading-none -mb-0.5">welcome to</p>
            <h2 className="font-display font-bold text-ink text-2xl">the sketchbook</h2>
          </div>
          <div className="text-right">
            <p className="text-[11px] text-ink-mute uppercase tracking-wider font-semibold">Page</p>
            <p className="font-display font-bold text-ink-mute">01 / 04</p>
          </div>
        </div>

        {/* Toggle pill */}
        <div role="tablist" className="relative grid grid-cols-2 gap-1 p-1 bg-ink/5 rounded-2xl mb-6">
          <motion.div
            layout
            transition={{ type:'spring', stiffness:380, damping:30 }}
            className={`absolute top-1 bottom-1 w-[calc(50%-4px)] rounded-xl bg-white shadow-md
              ${mode==='login' ? 'left-1' : 'left-[calc(50%+1px)]'}`}
          />
          {['login','signup'].map(m => (
            <button
              key={m}
              role="tab"
              aria-selected={mode===m}
              onClick={()=> setMode(m)}
              className={`relative z-10 py-2.5 font-display font-semibold capitalize transition-colors
                ${mode===m ? 'text-indigo-brand' : 'text-ink-mute hover:text-ink-soft'}`}
            >
              {m === 'login' ? 'Log in' : 'Sign up'}
            </button>
          ))}
        </div>

        {/* Form */}
        <form onSubmit={submit} className="space-y-4">
          <AnimatePresence mode="wait">
            {mode === 'signup' && (
              <motion.div
                key="name"
                initial={{ opacity:0, height:0, marginBottom:0 }}
                animate={{ opacity:1, height:'auto', marginBottom:0 }}
                exit={{ opacity:0, height:0, marginBottom:-16 }}
                transition={{ duration:0.35 }}
              >
                <Field
                  icon={I.User} label="Nickname"
                  value={form.name} onChange={(v)=>set('name',v)} onBlur={()=>blur('name')}
                  error={errors.name} touched={touched.name}
                  autoComplete="nickname"
                />
              </motion.div>
            )}
          </AnimatePresence>

          <Field
            icon={I.Mail} type="email" label="Email"
            value={form.email} onChange={(v)=>set('email',v)} onBlur={()=>blur('email')}
            error={errors.email} touched={touched.email}
            autoComplete="email"
          />

          <div>
            <Field
              icon={I.Lock} type={showPass?'text':'password'} label="Password"
              value={form.pass} onChange={(v)=>set('pass',v)} onBlur={()=>blur('pass')}
              error={errors.pass} touched={touched.pass}
              autoComplete={mode==='login' ? 'current-password' : 'new-password'}
              right={
                <button type="button" onClick={()=>setShowPass(s=>!s)}
                  className="text-ink-mute hover:text-ink p-1 -m-1">
                  {showPass ? <I.EyeOff size={16}/> : <I.Eye size={16}/>}
                </button>
              }
            />
            <AnimatePresence>
              {mode === 'signup' && form.pass && (
                <motion.div
                  initial={{ opacity:0, height:0 }} animate={{ opacity:1, height:'auto' }} exit={{ opacity:0, height:0 }}
                ><PasswordStrength value={form.pass}/></motion.div>
              )}
            </AnimatePresence>
          </div>

          {mode === 'login' && (
            <div className="flex items-center justify-between pt-1">
              <label className="flex items-center gap-2 text-[13px] text-ink-soft cursor-pointer select-none">
                <input type="checkbox" className="peer sr-only"/>
                <span className="w-4 h-4 rounded-md border border-ink/25 bg-white peer-checked:bg-indigo-brand peer-checked:border-indigo-brand transition-colors flex items-center justify-center">
                  <I.Check size={11} stroke={3} className="text-white opacity-0 peer-checked:opacity-100"/>
                </span>
                Keep me sketching
              </label>
              <a href="#" className="text-[13px] font-semibold text-indigo-brand hover:underline">Forgot?</a>
            </div>
          )}

          <motion.button
            type="submit"
            disabled={submitting}
            whileHover={!submitting ? { y:-2 } : {}}
            whileTap={!submitting ? { scale:0.97, y:0 } : {}}
            className={`relative w-full inline-flex items-center justify-center gap-2 font-display font-semibold text-paper text-lg py-3.5 rounded-2xl overflow-hidden
              ${submitting ? 'bg-ink' : 'bg-indigo-brand hover:bg-indigo-deep'}
              shadow-[0_6px_0_-1px_#1F1B5C] transition-colors`}
          >
            <AnimatePresence mode="wait">
              {done ? (
                <motion.span key="done"
                  initial={{ y:8, opacity:0 }} animate={{ y:0, opacity:1 }} exit={{ y:-8, opacity:0 }}
                  className="inline-flex items-center gap-2"
                ><I.Check size={18} stroke={3}/> Welcome aboard!</motion.span>
              ) : submitting ? (
                <motion.span key="loading"
                  initial={{ opacity:0 }} animate={{ opacity:1 }} exit={{ opacity:0 }}
                  className="inline-flex items-center gap-2"
                >
                  <span className="w-4 h-4 border-2 border-paper/40 border-t-paper rounded-full animate-spin"/>
                  Sharpening pencils…
                </motion.span>
              ) : (
                <motion.span key="cta"
                  initial={{ y:8, opacity:0 }} animate={{ y:0, opacity:1 }} exit={{ y:-8, opacity:0 }}
                  className="inline-flex items-center gap-2"
                >
                  {mode === 'login' ? 'Take me to my room' : 'Create my sketchbook'}
                  <I.Arrow size={18}/>
                </motion.span>
              )}
            </AnimatePresence>
          </motion.button>

          {/* Divider */}
          <div className="flex items-center gap-3 py-1">
            <div className="flex-1 h-px bg-ink/10"></div>
            <span className="font-hand text-ink-mute text-base">or</span>
            <div className="flex-1 h-px bg-ink/10"></div>
          </div>

          <motion.button
            type="button"
            whileHover={{ y:-1 }} whileTap={{ scale:0.98 }}
            className="w-full inline-flex items-center justify-center gap-2 bg-white/70 hover:bg-white border border-ink/10 text-ink font-semibold py-3 rounded-2xl"
          >
            <I.Users size={16}/> Play as a guest
            <span className="ml-1 text-[11px] uppercase tracking-wider bg-amber-soft/80 text-ink px-1.5 py-0.5 rounded font-bold">no email</span>
          </motion.button>
        </form>

        <p className="mt-5 text-[12px] text-ink-mute text-center leading-relaxed">
          By {mode === 'signup' ? 'signing up' : 'logging in'}, you agree to keep
          your drawings <span className="font-semibold text-ink">mostly</span> wholesome.
        </p>
      </div>

      {/* Bottom trust note */}
      <div className="mt-4 flex items-center justify-center gap-2 text-[12px] text-ink-mute font-medium">
        <span className="w-1.5 h-1.5 rounded-full bg-mint-splat"></span>
        end-to-end encrypted lobbies · no ads · open source
      </div>
    </motion.div>
  );
};
