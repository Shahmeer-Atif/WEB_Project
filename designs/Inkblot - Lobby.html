/* ─── Custom Room ─────────────────────────────────────────────────────── */
const Chip = ({ active, onClick, children }) => (
  <button onClick={onClick}
    className={`px-3.5 py-1.5 rounded-full text-sm font-semibold border transition-all
      ${active ? 'bg-ink text-paper border-ink shadow-[0_3px_0_-1px_#000]'
               : 'bg-white/60 text-ink-soft border-ink/10 hover:border-ink/30'}`}
  >{children}</button>
);

const CustomRoomCard = () => {
  const [name, setName] = useState("maple's atelier");
  const [players, setPlayers] = useState(8);
  const [rounds, setRounds] = useState(5);
  const [drawTime, setDrawTime] = useState(60);
  const [lang, setLang] = useState('English');
  const [privacy, setPrivacy] = useState('public');

  return (
    <motion.div
      initial={{ opacity:0, y:20 }} animate={{ opacity:1, y:0 }}
      transition={{ duration:0.6, delay:0.1 }}
      className="glass rounded-3xl p-7"
    >
      <div className="flex items-center justify-between mb-5">
        <div>
          <p className="font-hand text-rose-splat text-xl leading-none -mb-0.5">build your own —</p>
          <h2 className="font-display font-bold text-ink text-2xl">Create Custom Room</h2>
        </div>
        <button className="text-ink-mute hover:text-ink p-2" title="Randomize">
          <I.Dice size={18}/>
        </button>
      </div>

      <div className="space-y-4">
        <div>
          <label className="text-[11px] font-bold text-ink-mute uppercase tracking-wider mb-1.5 block">Room name</label>
          <input value={name} onChange={(e)=>setName(e.target.value)}
            className="w-full bg-white/80 border border-ink/10 rounded-xl px-4 py-2.5 outline-none focus:border-indigo-brand focus:ring-2 focus:ring-indigo-brand/20"/>
        </div>

        <div className="grid grid-cols-2 gap-3">
          <div>
            <label className="text-[11px] font-bold text-ink-mute uppercase tracking-wider mb-1.5 block">Players</label>
            <div className="flex flex-wrap gap-1.5">
              {[4,6,8,12].map(n => <Chip key={n} active={players===n} onClick={()=>setPlayers(n)}>{n}</Chip>)}
            </div>
          </div>
          <div>
            <label className="text-[11px] font-bold text-ink-mute uppercase tracking-wider mb-1.5 block">Rounds</label>
            <div className="flex flex-wrap gap-1.5">
              {[3,5,8,10].map(n => <Chip key={n} active={rounds===n} onClick={()=>setRounds(n)}>{n}</Chip>)}
            </div>
          </div>
        </div>

        <div>
          <label className="flex items-center justify-between text-[11px] font-bold text-ink-mute uppercase tracking-wider mb-1.5">
            <span>Draw time</span>
            <span className="text-ink font-display text-base normal-case tracking-normal">{drawTime}s</span>
          </label>
          <input type="range" min="30" max="120" step="10" value={drawTime} onChange={(e)=>setDrawTime(+e.target.value)}
            className="w-full accent-indigo-brand"/>
        </div>

        <div className="grid grid-cols-2 gap-3">
          <div>
            <label className="text-[11px] font-bold text-ink-mute uppercase tracking-wider mb-1.5 block">Language</label>
            <select value={lang} onChange={(e)=>setLang(e.target.value)}
              className="w-full bg-white/80 border border-ink/10 rounded-xl px-3 py-2.5 outline-none focus:border-indigo-brand">
              {['English','Français','Español','日本語','Türkçe'].map(l=> <option key={l}>{l}</option>)}
            </select>
          </div>
          <div>
            <label className="text-[11px] font-bold text-ink-mute uppercase tracking-wider mb-1.5 block">Privacy</label>
            <div className="grid grid-cols-2 gap-1 p-1 bg-ink/5 rounded-xl relative">
              <motion.div layout transition={{ type:'spring', stiffness:380, damping:30 }}
                className={`absolute top-1 bottom-1 w-[calc(50%-4px)] rounded-lg bg-white shadow-md ${privacy==='public' ? 'left-1' : 'left-[calc(50%+1px)]'}`}/>
              {['public','private'].map(p =>(
                <button key={p} onClick={()=>setPrivacy(p)}
                  className={`relative z-10 py-1.5 text-sm font-semibold capitalize flex items-center justify-center gap-1.5 ${privacy===p ? 'text-indigo-brand' : 'text-ink-mute'}`}>
                  {p === 'public' ? <I.Globe size={13}/> : <I.Lock size={13}/>} {p}
                </button>
              ))}
            </div>
          </div>
        </div>

        <motion.button
          whileHover={{ y:-2 }} whileTap={{ scale:0.97 }}
          className="w-full inline-flex items-center justify-center gap-2 bg-indigo-brand hover:bg-indigo-deep text-paper font-display font-semibold text-lg py-3.5 rounded-2xl shadow-[0_6px_0_-1px_#1F1B5C] mt-2"
        >
          <I.Plus size={18}/> Open the room
          <I.Arrow size={18}/>
        </motion.button>
      </div>
    </motion.div>
  );
};

/* ─── Word of the Day ─────────────────────────────────────────────────── */
const WordOfDay = () => {
  const word = 'PARADOX';
  const [revealed, setRevealed] = useState(Array(word.length).fill(false));
  useEffect(()=>{
    word.split('').forEach((_, i) => {
      setTimeout(()=> setRevealed(r => r.map((v,idx)=> idx<=i)), 300 + i*180);
    });
  }, []);
  return (
    <motion.div
      initial={{ opacity:0, y:20 }} animate={{ opacity:1, y:0 }}
      transition={{ duration:0.6, delay:0.15 }}
      className="relative bg-indigo-brand text-paper rounded-3xl p-7 overflow-hidden"
    >
      {/* paper texture overlay */}
      <div className="absolute inset-0 opacity-10 pointer-events-none"
        style={{backgroundImage:'radial-gradient(rgba(255,255,255,0.6) 1px, transparent 1px)', backgroundSize:'5px 5px'}}/>
      <div className="absolute -top-6 -right-6 w-28 h-28 rounded-full bg-amber-brand/30 blur-2xl"></div>

      <div className="relative">
        <div className="flex items-center gap-2 mb-3">
          <I.Sparkle size={16} className="text-amber-soft"/>
          <span className="font-hand text-amber-soft text-2xl leading-none">word of the day</span>
        </div>
        <div className="flex flex-wrap gap-1.5 mb-5">
          {word.split('').map((ch, i) => (
            <motion.div key={i}
              animate={{ rotateY: revealed[i] ? 0 : 90, opacity: revealed[i] ? 1 : 0.2 }}
              transition={{ duration: 0.4 }}
              className="w-10 h-12 sm:w-12 sm:h-14 rounded-lg bg-white/10 border border-white/20 flex items-center justify-center font-display font-bold text-2xl sm:text-3xl"
              style={{ transformStyle:'preserve-3d' }}
            >{ch}</motion.div>
          ))}
        </div>
        <p className="text-paper/75 text-sm leading-relaxed mb-4">
          Guess this in any room today and pick up <span className="font-display font-bold text-amber-soft">+500 ink</span> on top of the round bonus.
        </p>
        <div className="flex items-center gap-2 text-xs">
          <span className="bg-white/10 px-2.5 py-1 rounded-full">7 letters</span>
          <span className="bg-white/10 px-2.5 py-1 rounded-full">noun</span>
          <span className="bg-white/10 px-2.5 py-1 rounded-full">resets in 14h 22m</span>
        </div>
      </div>
    </motion.div>
  );
};
